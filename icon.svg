<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="#1a2a4a"/>

  <!-- Outer accent ring -->
  <circle cx="96" cy="96" r="83" fill="none" stroke="#ff6600" stroke-width="4" opacity="0.5"/>

  <!-- Gauge background track (270°, gap at bottom) -->
  <!-- Arc from (50,142) to (142,142) going clockwise through top = 270° -->
  <path d="M 50 142 A 65 65 0 1 1 142 142"
        fill="none" stroke="#243755" stroke-width="14" stroke-linecap="round"/>

  <!-- Gauge filled arc (orange, ~72% = ~195°) -->
  <!-- 135° + 195° = 330°: cos(330°)=0.866, sin(330°)=-0.5 → x=96+56.3=152, y=96-32.5=63 -->
  <path d="M 50 142 A 65 65 0 1 1 152 63"
        fill="none" stroke="#ff6600" stroke-width="9" stroke-linecap="round"/>

  <!-- Tick marks (7 ticks, default points UP then rotated) -->
  <!-- Tick line from (96,26) to (96,42) = outer/inner radii 70/54 from center -->
  <g stroke="#aac4e0" stroke-width="2.5" stroke-linecap="round">
    <line x1="96" y1="26" x2="96" y2="42" transform="rotate(225 96 96)"/>
    <line x1="96" y1="26" x2="96" y2="42" transform="rotate(270 96 96)"/>
    <line x1="96" y1="26" x2="96" y2="42" transform="rotate(315 96 96)"/>
    <line x1="96" y1="26" x2="96" y2="42" transform="rotate(0 96 96)"/>
    <line x1="96" y1="26" x2="96" y2="42" transform="rotate(45 96 96)"/>
    <line x1="96" y1="26" x2="96" y2="42" transform="rotate(90 96 96)"/>
    <line x1="96" y1="26" x2="96" y2="42" transform="rotate(135 96 96)"/>
  </g>

  <!-- Needle pointing at 330° (toward 152,63) -->
  <!-- Direction: (56,−33)/65 ≈ (0.861,−0.508) -->
  <!-- Tip r=54: (96+46.5, 96−27.4)=(142.5, 68.6) -->
  <!-- Base r=12 opposite: (96−10.3, 96+6.1)=(85.7, 102.1) -->
  <line x1="86" y1="102" x2="143" y2="69"
        stroke="#ff6600" stroke-width="4" stroke-linecap="round"/>

  <!-- Center hub -->
  <circle cx="96" cy="96" r="10" fill="#ff6600"/>
  <circle cx="96" cy="96" r="5"  fill="#1a2a4a"/>

  <!-- App name in the gauge gap area -->
  <text x="96" y="147" font-family="Arial,sans-serif" font-size="13"
        font-weight="bold" fill="#aac4e0" text-anchor="middle" letter-spacing="1">ポンプ</text>
  <text x="96" y="165" font-family="Arial,sans-serif" font-size="18"
        font-weight="bold" fill="#ffffff" text-anchor="middle">太郎</text>
</svg>
